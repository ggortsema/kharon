name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kharon-dev
  ECR_REGISTRY: 359546647832.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_URI: 359546647832.dkr.ecr.us-east-1.amazonaws.com/kharon-dev

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Import check
        run: uv run python -c "from kharon.main import app; print(app.title)"

      - name: Custom action demo
        uses: ./.github/actions/echo-message
        with:
          message: "hello from CI custom action"

      - name: Endpoint check
        run: |
          uv run python - <<'PY'
          import asyncio
          import httpx

          from kharon.main import app


          async def check() -> None:
              transport = httpx.ASGITransport(app=app)
              async with httpx.AsyncClient(transport=transport, base_url="http://test") as client:
                  response = await client.get("/")
                  assert response.status_code == 200
                  payload = response.json()
                  assert isinstance(payload, dict)
                  assert "message" in payload
                  assert isinstance(payload["message"], str)
                  assert payload["message"].strip()


          asyncio.run(check())
          print("endpoint ok")
          PY

  docker-build:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::359546647832:role/kharon-gha-terraform-plan-apply

      - name: Wait for ECR repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          for i in $(seq 1 24); do
            if aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "ECR repository is ready"
              exit 0
            fi
            echo "Waiting for ECR repository $ECR_REPOSITORY to exist..."
            sleep 10
          done

          echo "Timed out waiting for ECR repository $ECR_REPOSITORY"
          exit 1

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_URI }}:latest
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:v0.0.${{ github.run_number }}
