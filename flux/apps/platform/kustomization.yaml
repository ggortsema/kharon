apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace-external-dns.yaml
  - helmrepository-eks-charts.yaml
  - helmrepository-bitnami.yaml
  - helmrelease-aws-load-balancer-controller.yaml
  - helmrelease-external-dns.yaml
  - imagerepository-kharon.yaml
  - imagepolicy-kharon.yaml
  - imageupdateautomation-kharon.yaml

patches:
  - target:
      kind: ServiceAccount
      name: image-reflector-controller
      namespace: flux-system
    patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: image-reflector-controller
        namespace: flux-system
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::359546647832:role/kharon-flux-image-reflector
